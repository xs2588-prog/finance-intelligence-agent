<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Intelligence Agent</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #07111f; color: #e6edf7; }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0; }
    .eyebrow { color: #5eead4; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(36px, 8vw, 64px); line-height: 1; letter-spacing: -.04em; }
    .intro { max-width: 620px; color: #9eb0c8; font-size: 18px; line-height: 1.6; }
    .card { margin-top: 36px; padding: 24px; border: 1px solid #24364d; border-radius: 18px; background: #0d1a2b; box-shadow: 0 20px 70px #0008; }
    label { display: block; margin-bottom: 10px; font-weight: 700; }
    .row { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; padding: 14px 16px; border: 1px solid #344963; border-radius: 10px; background: #081321; color: white; font: inherit; }
    input:focus { outline: 2px solid #2dd4bf; border-color: transparent; }
    button { padding: 14px 20px; border: 0; border-radius: 10px; background: #2dd4bf; color: #06201d; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .examples button { padding: 7px 10px; border: 1px solid #344963; background: transparent; color: #b9c7d9; font-size: 12px; }
    #result { display: none; margin-top: 22px; padding: 18px; border-left: 3px solid #2dd4bf; background: #081321; border-radius: 6px; white-space: pre-wrap; line-height: 1.6; }
    #meta { margin-bottom: 6px; color: #5eead4; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    footer { margin-top: 24px; color: #71839a; font-size: 12px; }
    @media (max-width: 560px) { .row { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Portfolio Project</div>
    <h1>Market Intelligence Agent</h1>
    <p class="intro">Ask concise stock-research questions about prices, trends, risk, comparisons, news, and sentiment.</p>

    <section class="card">
      <form id="question-form">
        <label for="query">What would you like to analyze?</label>
        <div class="row">
          <input id="query" name="query" value="How is AAPL trading?" autocomplete="off" required>
          <button id="submit" type="submit">Analyze</button>
        </div>
      </form>
      <div class="examples" aria-label="Example questions">
        <button type="button" data-query="How is AAPL trading?">AAPL price</button>
        <button type="button" data-query="Compare AAPL vs MSFT risk">Compare risk</button>
        <button type="button" data-query="Show me NVDA technical trend">NVDA trend</button>
        <button type="button" data-query="What is TSLA sentiment?">TSLA sentiment</button>
      </div>
      <div id="result" role="status"><div id="meta"></div><div id="answer"></div></div>
    </section>
    <footer>Educational research only — not financial advice. News features require a Finnhub API key.</footer>
  </main>

  <script>
    const form = document.querySelector('#question-form');
    const input = document.querySelector('#query');
    const submit = document.querySelector('#submit');
    const result = document.querySelector('#result');
    const meta = document.querySelector('#meta');
    const answer = document.querySelector('#answer');

    document.querySelectorAll('[data-query]').forEach(button => {
      button.addEventListener('click', () => { input.value = button.dataset.query; input.focus(); });
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      submit.disabled = true;
      submit.textContent = 'Analyzing…';
      result.style.display = 'block';
      meta.textContent = 'Working';
      answer.textContent = 'Fetching market data…';
      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({query: input.value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Analysis failed');
        meta.textContent = `${data.ticker} · ${data.intent}`;
        answer.textContent = data.answer;
      } catch (error) {
        meta.textContent = 'Unable to analyze';
        answer.textContent = error.message;
      } finally {
        submit.disabled = false;
        submit.textContent = 'Analyze';
      }
    });
  </script>
</body>
</html>
