[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-intelligence-agent"
version = "1.0.0"
description = "A modular stock research assistant combining price, news, sentiment, and technical signals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "finnhub-python>=2.4,<3",
  "Flask>=3.0,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "python-dotenv>=1.0,<2",
  "yfinance>=0.2.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
finance-agent = "finance_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
